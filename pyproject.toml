[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "estrellio-logging-lib"
version = "0.1.0"
description = "Small logging helpers for CLI-style Python tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "shade" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jiangnanqw12/estrellio_logging_lib"
Repository = "https://github.com/jiangnanqw12/estrellio_logging_lib"
Issues = "https://github.com/jiangnanqw12/estrellio_logging_lib/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["estrellio_logging_lib", "estrellio_logging_lib.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
